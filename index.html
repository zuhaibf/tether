<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7fd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14121c" media="(prefers-color-scheme: dark)">
<title>Tether</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="image.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<script>
// Apply saved theme (or system default) before first paint to avoid a flash.
(function () {
  try {
    var saved = localStorage.getItem('tether-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) {}
})();
</script>
<style>
:root {
  color-scheme: light dark;

  /* LIGHT — palette sampled from image.png (pink → purple swirl) */
  --bg: #faf7fd;
  --surface: #ffffff;
  --surface-2: #f4eefb;

  --ink: #211b2e;
  --ink-dim: #6f6685;

  /* accent (primary) = purple from the swirl */
  --gold: #8b46f0;
  --gold-dim: #efe6fd;

  /* secondary accent = pink from the swirl */
  --sage: #ec4f9c;
  --sage-dim: #fde4f1;

  --rust: #e5695a;
  --line: #ece3f6;

  --brand-grad: linear-gradient(135deg, #fc94a3, #ec79cd, #a063f5);

  --radius: 20px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {

    --bg:#14121c;
    --surface:#1c1926;
    --surface-2:#241f33;

    --ink:#f2ecf7;
    --ink-dim:#948aa8;

    /* accent (primary) = lighter purple for contrast on dark */
    --gold:#b98cff;
    --gold-dim:#2c2340;

    /* secondary accent = pink */
    --sage:#f472b6;
    --sage-dim:#3a2233;

    --rust:#d1705c;
    --line:#302a3f;

    --brand-grad: linear-gradient(135deg, #fc94a3, #ec79cd, #a063f5);
  }
}

/* Manual override — forces dark regardless of system setting */
:root[data-theme="dark"] {
  --bg:#14121c;
  --surface:#1c1926;
  --surface-2:#241f33;

  --ink:#f2ecf7;
  --ink-dim:#948aa8;

  --gold:#b98cff;
  --gold-dim:#2c2340;

  --sage:#f472b6;
  --sage-dim:#3a2233;

  --rust:#d1705c;
  --line:#302a3f;

  --brand-grad: linear-gradient(135deg, #fc94a3, #ec79cd, #a063f5);
}  
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    transition:background .25s ease,color .25s ease;}
  .frame{max-width:430px;margin:0 auto;min-height:100vh;padding:28px 20px 110px;position:relative;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 2px;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:28px;margin:0 0 22px;letter-spacing:-.01em;}
  h2{font-family:'Fraunces',serif;font-weight:500;font-size:20px;margin:0 0 14px;}
  p.sub{font-size:13px;color:var(--ink-dim);line-height:1.5;margin:0 0 20px;}

  label{display:block;font-size:12px;color:var(--ink-dim);margin:14px 0 6px;font-weight:600;}
  input,select{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);
    border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:'Inter';}
  input:focus,select:focus{outline:none;border-color:var(--gold);}
  .btn{width:100%;border:none;border-radius:12px;padding:13px 0;font-size:14.5px;font-weight:700;

  .sub-check svg{width:11px;height:11px;stroke:#14131a;stroke-width:3;fill:none;

  .sub-stake{font-family:'Fraunces',serif;font-size:12px;color:var(--ink-dim);}

    padding:3px 8px;border-radius:999px;flex-shrink:0;}
  .status-pill.missed{background:rgba(181,101,74,.18);color:var(--rust);}
  .status-pill.paused{background:var(--surface-2);color:var(--ink-dim);}

  .wish,.owed{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;margin-bottom:8px;}
  .wish-thumb,.owed-thumb{width:40px;height:40px;border-radius:10px;background:var(--surface-2);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:17px;}

  .chip button{background:none;border:none;color:var(--ink-dim);cursor:pointer;font-size:12px;padding:0;}

  .tabbar button{flex:1;background:none;border:none;color:var(--ink-dim);font-size:11px;font-weight:600;

    background:var(--surface-2);border:1px solid var(--line);color:var(--ink);padding:9px 16px;
    border-radius:999px;font-size:12.5px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;
    z-index:20;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .type-toggle{display:flex;gap:8px;margin-top:6px;}
  .type-toggle button{flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-dim);
    border-radius:10px;padding:8px 0;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter';}
  .type-toggle button.active{background:var(--gold);color:#14131a;border-color:var(--gold);}

  /* Settings rows + theme segmented control (You tab) */
  .settings-label{font-size:12px;color:var(--ink-dim);font-weight:600;margin:0 0 8px;letter-spacing:.01em;}
  .seg{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:12px;padding:4px;}
  .seg button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    background:none;border:none;color:var(--ink-dim);font-size:12px;font-weight:600;font-family:'Inter';
    border-radius:9px;padding:9px 0;cursor:pointer;transition:background .18s ease,color .18s ease;}
  .seg button svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;
    stroke-linecap:round;stroke-linejoin:round;}

  .seg button.active{background:var(--surface);color:var(--gold);

</style>

<body>
<div class="frame" id="frame">
  <div class="spin" id="loading">Loading…</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// THEME — light / dark / system, with manual override persisted.
// Exposes a small global API used by the You tab's segmented control.
// ============================================================
var Theme = (function () {
  var root = document.documentElement;
  var media = window.matchMedia('(prefers-color-scheme: dark)');

  function stored() {
    try { return localStorage.getItem('tether-theme'); } catch (e) { return null; }
  }
  // What the user picked: 'light' | 'dark' | 'system'
  function preference() {
    var s = stored();
    return (s === 'light' || s === 'dark') ? s : 'system';
  }
  // What's actually showing right now: 'light' | 'dark'
  function effective() {
    var s = stored();
    if (s === 'light' || s === 'dark') return s;
    return media.matches ? 'dark' : 'light';
  }
  function applyMeta() {
    var meta = document.querySelector('meta[name="theme-color"]:not([media])');
    if (!meta) {
      meta = document.createElement('meta');
      meta.name = 'theme-color';
      document.head.appendChild(meta);
    }
    meta.setAttribute('content', effective() === 'dark' ? '#14121c' : '#faf7fd');
  }
  function set(mode) {
    if (mode === 'light' || mode === 'dark') {
      try { localStorage.setItem('tether-theme', mode); } catch (e) {}
      root.setAttribute('data-theme', mode);
    } else {
      try { localStorage.removeItem('tether-theme'); } catch (e) {}
      root.removeAttribute('data-theme');
    }
    applyMeta();
    if (typeof Theme !== 'undefined' && Theme.onChange) Theme.onChange(preference());
  }

  // Follow OS changes live while on 'system'.
  media.addEventListener('change', function () {
    if (preference() === 'system') { applyMeta(); if (Theme.onChange) Theme.onChange('system'); }
  });

  applyMeta();
  return { preference: preference, effective: effective, set: set, onChange: null };
})();

// ============================================================
// CONFIG — pulled from config.js (see config.example.js for the template).
// Run schema.sql once in the Supabase SQL editor before first use.
// ============================================================
const SUPABASE_URL = window.TETHER_CONFIG?.SUPABASE_URL;
const SUPABASE_ANON_KEY = window.TETHER_CONFIG?.SUPABASE_ANON_KEY;

if (!SUPABASE_URL || !SUPABASE_ANON_KEY || SUPABASE_URL.includes('YOUR-PROJECT')) {
  document.getElementById('frame').innerHTML =
    '<div class="spin">config.js is missing your Supabase URL/key — see config.example.js.</div>';
  throw new Error('Tether: config.js not set up yet');
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const frame = document.getElementById('frame');
const CADENCE_FACTOR = { daily: 1, weekly: 2.2, monthly: 4 };

let me = null;          // auth user
let profile = null;     // profiles row
let paired = false;
let activeTab = 'today';
let today = { goals: [], pool: 0 };

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }

// ============================================================
// PWA service worker + Web Push helpers
// ============================================================
let swReg = null;
let graceRemaining = null; // set by renderToday, read by renderSingleGoal

async function registerSW(){
  if (!('serviceWorker' in navigator)) return null;
  try { swReg = await navigator.serviceWorker.register('sw.js'); return swReg; }
  catch (e) { return null; }
}
function pushSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function urlB64ToUint8Array(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const base = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function pushState(){
  if (!pushSupported()) return 'unsupported';
  if (!window.TETHER_CONFIG?.VAPID_PUBLIC_KEY) return 'unconfigured';
  if (Notification.permission === 'denied') return 'denied';
  const reg = swReg || await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  return sub ? 'on' : 'off';
}
async function enablePush(){
  const vapid = window.TETHER_CONFIG?.VAPID_PUBLIC_KEY;
  if (!vapid) throw new Error('Notifications are not configured yet.');
  const reg = swReg || await registerSW();
  if (!reg) throw new Error('Service worker unavailable.');
  await navigator.serviceWorker.ready;
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('Permission denied.');
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlB64ToUint8Array(vapid)
  });
  const j = sub.toJSON();
  const { error } = await sb.from('push_subscriptions').upsert({
    owner_id: me.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth
  }, { onConflict: 'endpoint' });
  if (error) throw error;
}
async function disablePush(){
  const reg = swReg || await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  if (sub){
    const ep = sub.endpoint;
    await sub.unsubscribe();
    await sb.from('push_subscriptions').delete().eq('endpoint', ep);
  }
}

// ---------- boot ----------
async function boot(){
  registerSW();
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ renderAuth(); return; }
  me = session.user;
  await loadProfile();
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT'){ me = null; profile = null; renderAuth(); }
});

async function loadProfile(){
  const { data, error } = await sb.from('profiles').select('*').eq('id', me.id).single();
  if (error){ renderAuth(); return; }
  profile = data;
  // Keep the server timezone current — the nightly auto-resolve and evening
  // reminders both key off it.
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if (tz && tz !== profile.timezone){
    sb.from('profiles').update({ timezone: tz }).eq('id', me.id);
    profile.timezone = tz;
  }
  if (!profile.couple_id){ renderPairing(); return; }
  const { data: joined } = await sb.rpc('partner_joined');
  paired = !!joined;
  if (!paired){ renderWaiting(); return; }
  await renderApp();
}

// ============================================================
// AUTH SCREENS
// ============================================================
function renderAuth(){
  frame.innerHTML = `
    <p class="eyebrow">Tether</p>
    <h1>We're keeping<br>each other honest.</h1>
    <div id="authForm">
      <label>Display name</label>
      <input id="afName" placeholder="e.g. Zuhaib" />
      <label>Email</label>
      <input id="afEmail" type="email" placeholder="you@example.com" />
      <label>Password</label>
      <input id="afPass" type="password" placeholder="At least 6 characters" />
      <button class="btn primary" id="afSubmit">Create account</button>
      <button class="link-btn" id="afToggle">Already have an account? Sign in</button>
      <div id="afErr"></div>
    </div>
  `;
  let mode = 'signup';
  const nameField = document.querySelector('#afName').parentElement.previousElementSibling ? null : null;
  document.getElementById('afToggle').onclick = () => {
    mode = mode === 'signup' ? 'signin' : 'signup';
    document.getElementById('afSubmit').textContent = mode === 'signup' ? 'Create account' : 'Sign in';
    document.getElementById('afToggle').textContent = mode === 'signup'
      ? 'Already have an account? Sign in' : "New here? Create an account";
    document.getElementById('afName').closest('label') ;
    document.querySelectorAll('#authForm label')[0].style.display = mode === 'signup' ? 'block' : 'none';
    document.getElementById('afName').style.display = mode === 'signup' ? 'block' : 'none';
  };
  document.getElementById('afSubmit').onclick = async () => {
    const email = document.getElementById('afEmail').value.trim();
    const pass = document.getElementById('afPass').value;
    const name = document.getElementById('afName').value.trim();
    const errEl = document.getElementById('afErr');
    errEl.innerHTML = '';

        email, password: pass, options: { data: { display_name: name } }

        errEl.innerHTML = '<div class="err">Check your email to confirm, then sign in.</div>';

    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error){ errEl.innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
      me = data.user; await loadProfile();
    }
  };
}

// ---------- TODAY ----------
function currentStake(weight, cadence, streak){
  const mult = 1 + Math.min(streak, 20) * 0.03;
  return Math.round(weight * (CADENCE_FACTOR[cadence] || 1) * mult * 10) / 10;
}
function itemStake(weight, streak){
  const mult = 1 + Math.min(streak, 20) * 0.03;
  return Math.round(weight * mult * 10) / 10;
}

async function fetchGoalsWithItems(){
  const { data: goals } = await sb.from('goals').select('*').eq('archived', false).order('sort_order');
  const { data: items } = await sb.from('goal_items').select('*').order('sort_order');
  const { data: checkins } = await sb.from('checkins').select('*').eq('log_date', todayStr());
  const itemsByGoal = {};
  (items || []).forEach(it => { (itemsByGoal[it.goal_id] ||= []).push(it); });
  const checkinMap = {};
  (checkins || []).forEach(c => { checkinMap[c.goal_id + ':' + (c.item_id || 'null')] = c; });
  return { goals: goals || [], itemsByGoal, checkinMap };
}

async function renderToday(){
  const { data: p } = await sb.from('profiles').select('pool').eq('id', me.id).single();
  const pool = p?.pool || 0;
  const { data: grace } = await sb.rpc('grace_status');
  graceRemaining = grace ? grace.remaining : null;
  const { goals, itemsByGoal, checkinMap } = await fetchGoalsWithItems();

  const maxRef = Math.max(60, pool * 1.2);
  const pct = Math.min(100, (pool / maxRef) * 100);

  const graceLine = grace
    ? `<span style="float:right;font-weight:600;">${grace.remaining} of ${grace.allowance} grace left</span>`
    : '';

  const panel = document.getElementById('panelToday');
  panel.innerHTML = `
    <div class="pools">
      <div class="vessel-wrap">
        <div class="vessel"><div class="liquid" style="height:${pct}%"></div></div>
        <div class="vessel-label">Your pool</div>
        <div class="vessel-amt">${pool.toFixed(1)}</div>
      </div>
    </div>
    <p class="section-title">Today's goals ${graceLine}</p>
    <div id="todayGoals"></div>
    <button class="btn ghost" id="btnResolve">End day →</button>
    <p class="resolve-note">Run this once, at the end of the night, after you've checked off what you got done. Anything left unmarked counts as missed, and its stake moves into your partner's pool. Out of town or sick? Pause a goal to spend a grace day — no stake moves and your streak is kept.</p>
  `;
  const list = document.getElementById('todayGoals');
  if (goals.length === 0){
    list.innerHTML = '<div class="empty-note">No goals yet — add one from the Goals tab.</div>';
  }
  goals.forEach(g => {
    if (g.type === 'checklist'){
      list.appendChild(renderChecklistGoal(g, itemsByGoal[g.id] || [], checkinMap));
    } else {
      list.appendChild(renderSingleGoal(g, checkinMap));
    }
  });
  document.getElementById('btnResolve').onclick = resolveToday;
}

function renderSingleGoal(g, checkinMap){
  const key = g.id + ':null';
  const ci = checkinMap[key];
  const status = ci ? ci.status : 'pending';
  const row = document.createElement('div');
  row.className = 'goal' + (status === 'exempt' ? ' exempt' : '');
  let checkClass = 'check';
  if (status === 'missed') checkClass += ' missed';
  else if (status === 'done') checkClass += ' done';
  const statusPill = status === 'exempt' ? '<span class="status-pill paused">Paused</span>'
    : (status === 'missed' ? '<span class="status-pill missed">Missed</span>' : '');
  row.innerHTML = `
    <button class="${checkClass}" data-action="single" data-goal="${g.id}" ${status==='exempt'?'disabled':''}>
      <svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg>
    </button>
    <div class="goal-main">
      <div class="goal-name">${esc(g.name)}</div>
      <div class="goal-meta">
        <span>${esc(g.category)}</span>
        ${g.streak > 0 ? `<span class="flame">🔥 ${g.streak}</span>` : ''}
      </div>
    </div>
    ${statusPill}
    <span class="stake-tag">±${currentStake(g.weight, g.cadence, g.streak)}</span>
    <button class="exempt-btn" data-action="exempt" data-goal="${g.id}"
      ${status !== 'exempt' && graceRemaining === 0 ? 'disabled' : ''}
      title="${status === 'exempt' ? 'Resume this goal' : (graceRemaining === 0 ? 'No grace days left this month' : 'Spend a grace day (pause)')}">
      ${status==='exempt' ? '↩' : '⏸'}
    </button>
  `;
  return row;
}

function renderChecklistGoal(g, items, checkinMap){
  const row = document.createElement('div');
  row.className = 'goal grouped';
  const head = document.createElement('div');
  head.className = 'goal-head';
  head.innerHTML = `
    <div class="goal-main">
      <div class="goal-name">${esc(g.name)}</div>
      <div class="goal-meta"><span>${esc(g.category)}</span></div>
    </div>
  `;
  row.appendChild(head);
  items.forEach(it => {
    const key = g.id + ':' + it.id;
    const ci = checkinMap[key];
    const status = ci ? ci.status : 'pending';
    const sub = document.createElement('div');
    sub.className = 'sub-row';
    let checkClass = 'sub-check';
    if (status === 'missed') checkClass += ' missed';
    else if (status === 'done') checkClass += ' done';
    sub.innerHTML = `
      <button class="${checkClass}" data-action="sub" data-goal="${g.id}" data-item="${it.id}">
        <svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg>
      </button>
      <span class="sub-name">${esc(it.name)}</span>
      <span class="sub-stake">±${itemStake(it.weight, it.streak)}</span>
    `;
    row.appendChild(sub);
  });
  return row;
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn || !document.getElementById('panelToday')?.contains(btn)) return;
  const action = btn.dataset.action;
  const goalId = btn.dataset.goal;
  if (action === 'single'){
    await setCheckin(goalId, null, 'done');
  } else if (action === 'sub'){
    await setCheckin(goalId, btn.dataset.item, 'done');
  } else if (action === 'exempt'){
    const isPaused = btn.textContent.trim() === '↩';
    const { error } = await sb.rpc('set_grace', { p_goal_id: goalId, p_date: todayStr(), p_on: !isPaused });
    if (error){
      showToast(/grace/i.test(error.message) ? 'No grace days left this month' : ('Could not update: ' + error.message));
    }
  }
  await renderToday();
});

async function setCheckin(goalId, itemId, status){
  const payload = {
    owner_id: me.id, goal_id: goalId, item_id: itemId,
    log_date: todayStr(), status
  };
  const { error } = await sb.from('checkins')
    .upsert(payload, { onConflict: 'goal_id,item_id,log_date' });
  if (error) showToast('Could not save: ' + error.message);
}

async function resolveToday(){
  const { error } = await sb.rpc('resolve_day', { p_date: todayStr() });
  if (error){ showToast('Could not resolve: ' + error.message); return; }
  showToast('Day resolved — pools only move when something was missed');
  await renderToday();
}

    const iAmOwer = o.owed_by === me.id;
    let pillClass = 'waiting', pillText = 'Waiting on partner';

    if (o.acknowledged) { pillClass = 'acked'; pillText = iAmOwer ? 'You acknowledged' : 'Acknowledged'; }

    if (iAmOwer && !o.acknowledged) actionBtn = `<button class="owed-btn" data-action="ack" data-id="${o.id}">Got it</button>`;
    else if (iAmOwer && o.acknowledged) actionBtn = `<button class="owed-btn primary" data-action="fulfill" data-id="${o.id}">Mark gifted</button>`;

    row.className = 'owed';

  box.querySelectorAll('button[data-action]').forEach(b => {
    b.onclick = async () => {
      const field = b.dataset.action === 'ack' ? { acknowledged: true } : { fulfilled: true };
      const { error } = await sb.from('owed_gifts').update(field).eq('id', b.dataset.id);
      if (error){ showToast(error.message); return; }

  const notifBody = {
    unsupported: `<div class="goal-meta">Notifications aren't supported on this browser.</div>`,
    unconfigured: `<div class="goal-meta">Not set up yet — add a VAPID public key to config.js.</div>`,
    denied: `<div class="goal-meta">Blocked in your browser settings. Re-allow notifications for this site, then reload.</div>`,
    off: `<button class="btn primary" id="pushToggle" style="margin-top:12px;">Enable notifications</button>`,
    on: `<div class="goal-meta" style="margin-bottom:2px;">On — you'll get an evening nudge for open goals and a ping when a reward is claimed.</div>
         <button class="btn ghost" id="pushToggle" style="margin-top:12px;">Turn off</button>`
  }[pState] || '';

  const graceCard = grace ? `
    <div class="card">
      <p class="settings-label">Grace days</p>
      <div class="goal-name">${grace.remaining} of ${grace.allowance} left</div>
      <div class="goal-meta" style="margin-top:6px;">Pause a goal on the Today tab to spend one. Resets on the 1st of each month.</div>
    </div>` : '';

  panel.innerHTML = `
    <div class="card">
      <div class="goal-name">${esc(profile.display_name)}</div>
      <div class="goal-meta" style="margin-top:6px;">Paired and syncing</div>
    </div>
    <div class="card">
      <p class="settings-label">Appearance</p>
      <div class="seg" id="themeSeg" role="group" aria-label="Theme">
        <button data-theme-choice="light" type="button" aria-label="Light theme">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
          Light
        </button>
        <button data-theme-choice="dark" type="button" aria-label="Dark theme">
          <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 7 7 0 1 0 20 14.5z"/></svg>
          Dark
        </button>
        <button data-theme-choice="system" type="button" aria-label="Match system theme">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12.5" rx="1.5"/><path d="M8.5 20.5h7M12 16.5v4"/></svg>
          System
        </button>
      </div>
    </div>
    <div class="card">
      <p class="settings-label">Notifications</p>
      ${notifBody}
    </div>
    ${graceCard}
    <button class="btn ghost" id="youSignOut">Sign out</button>
  `;

  const seg = document.getElementById('themeSeg');
  function paintSeg(pref){
    seg.querySelectorAll('button').forEach(b =>
      b.classList.toggle('active', b.dataset.themeChoice === pref));
  }
  paintSeg(Theme.preference());
  Theme.onChange = paintSeg;
  seg.querySelectorAll('button').forEach(b =>
    b.onclick = () => Theme.set(b.dataset.themeChoice));

  const pushBtn = document.getElementById('pushToggle');
  if (pushBtn){
    pushBtn.onclick = async () => {
      pushBtn.disabled = true;
      try {
        if (pState === 'on'){ await disablePush(); showToast('Notifications turned off'); }
        else { await enablePush(); showToast('Notifications enabled'); }
      } catch (e){ showToast(e.message || 'Could not update notifications'); }
      renderYouTab();
    };
  }

  document.getElementById('youSignOut').onclick = async () => { await sb.auth.signOut(); };
}

boot();
</script>
</body>
</html>
